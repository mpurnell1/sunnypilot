# Page: navigation
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: navigation
label: Navigation
icon: navigation
order: 8
remote_configurable: true
description: The navigation service and its guidance on the driving screen
sections:
- id: service
  title: ''
  description: ''
  items:
  - key: AllowNavigation
    widget: toggle
    title: Allow Navigation
    description: The navigation service that calculates routes on the comma. Away from home wifi it needs a data
      connection (comma prime/eSIM or mobile hotspot) to route. While it is off, no destination can be set. For now, the
      Mapbox token must be set in the sunnynav app (Settings > Map) or on the device-hosted page (Settings), which is
      at<br>{device_page}
    enablement:
    - $ref: '#/macros/offroad'
  - key: MapboxRecompute
    widget: toggle
    title: Mapbox Recompute
    description: Recompute the route automatically when you leave it. The device needs a data connection (comma
      prime/eSIM or mobile hotspot) for this to work, otherwise the route, and navigation, is lost.
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavDesiresAllowed
    widget: toggle
    title: Navigation Desires
    description: Send turn desires to follow your selected route when you signal.
    enablement:
    - $ref: '#/macros/offroad'
- id: guidance
  title: Guidance
  description: The turn card, lanes and sounds while a route is active
  items:
  - key: NavHudMode
    widget: multiple_button
    title: Navigation HUD
    description: 'Turns: next-turn card under the set speed. ETA: arrival pill tucked under the nav chip, comma 3X only.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Turns
    - value: 2
      label: ETA
      enablement:
      - $ref: '#/macros/hide_on_mici'
    - value: 3
      label: Both
      enablement:
      - $ref: '#/macros/hide_on_mici'
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavLaneGuidance
    widget: toggle
    title: Show Lanes
    description: Show which lanes lead to the next maneuver.
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavLaneChangeTimer
    widget: option
    title: Route-Requested Lane Change Delay
    description: A separate lane change delay for changes requested by the navigation logic.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavigationAudio
    widget: toggle
    title: Navigation Audio
    description: 'A tone pair for each maneuver: rising means right, falling means left, faster and doubled when the turn
      is close.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavMiciQuietGlyph
    widget: toggle
    title: Quiet Glyph
    description: Keep a dim next-turn arrow on screen between maneuvers.
    visibility:
    - type: capability
      field: device_type
      equals: mici
    enablement:
    - $ref: '#/macros/offroad'
